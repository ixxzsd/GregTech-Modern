name: Build and ensure label

# 1) Права: чтение содержимого репозитория и запись в issues
permissions:
  contents: write
  issues: write

# 2) Когда запускать (пример – на каждый PR в main)
on:
  pull_request:
    branches: [ main ]

jobs:
  # Ваша уже существующая джоба сборки
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # … ваши шаги для сборки …

  # 3) Новая джоба – проверка/создание лейбла
  ensure-label:
    name: Ensure “ignore changelog” label
    runs-on: ubuntu-latest
    needs: build                 # будет ждать завершения сборки
    steps:
      - uses: actions/checkout@v4

      - name: Create or update "ignore changelog" label
        uses: peter-evans/create-or-update-label@v3
        with:
          token: ${{ secrets.GH_FULL_TOKEN }}
          name: ignore changelog
          color: FFFFFF
          description: Не учитывать этот PR при генерации changelog
