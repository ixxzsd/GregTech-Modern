name: Sync Workflows from Upstream

on:
  schedule:
    - cron:  '0 * * * *'     # каждый час
  workflow_dispatch:       # + ручной запуск

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: GregTechCEu/GregTech-Modern
          token: ${{ secrets.GH_PAT }}
          path: upstream

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          repository: ixxzsd/GregTech-Modern   # ваш форк
          token: ${{ secrets.GH_PAT }}
          path: fork
          ref: gh/workflow-sync

      - name: Copy workflows
        run: |
          rm -rf fork/.github/workflows
          cp -R upstream/.github/workflows fork/.github/workflows

      - name: Commit & Push
        working-directory: fork
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git diff --staged --quiet || git commit -m "Sync workflows from upstream"
          git push origin gh/workflow-sync
